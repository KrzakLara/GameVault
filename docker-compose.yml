services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gamevault
      MYSQL_USER: gamevault
      MYSQL_PASSWORD: gamevault_local_dev
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - gamevault_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  gamevault_mysql:
